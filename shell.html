<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Sticky</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bar-height: 32px;
      --bg: #1a1a1a;
      --bar-bg: #0d0d0d;
      --bar-hover: #2a2a2a;
      --accent: #ffcc00;
      --text: #999;
      --text-light: #ccc;
      --border: rgba(255, 255, 255, 0.06);
      --close-hover: #e84040;
      --radius: 10px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border-radius: var(--radius);
    }

    /* ── Custom title bar ────────────────────────── */
    .titlebar {
      height: var(--bar-height);
      background: var(--bar-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 12px;
      -webkit-app-region: drag;
      user-select: none;
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .titlebar-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.9;
    }

    .titlebar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .titlebar-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      width: 28px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .titlebar-btn:hover {
      background: var(--bar-hover);
      color: var(--text-light);
    }

    .titlebar-btn.close:hover {
      background: var(--close-hover);
      color: #fff;
    }

    .titlebar-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* ── Opacity slider (hidden until hover on titlebar) ───── */
    .opacity-control {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .titlebar:hover .opacity-control {
      opacity: 1;
    }

    .opacity-slider {
      width: 50px;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .opacity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* ── Notion iframe ───────────────────────────── */
    .content {
      height: calc(100% - var(--bar-height));
      width: 100%;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* ── Resize handle hint ──────────────────────── */
    .resize-hint {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      opacity: 0.2;
    }

    .resize-hint svg {
      width: 100%;
      height: 100%;
      stroke: var(--text);
      stroke-width: 1.5;
      fill: none;
    }

    /* ── Loading state ───────────────────────────── */
    .loading-overlay {
      position: absolute;
      top: var(--bar-height);
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 204, 0, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Title bar -->
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-dot"></div>
      <span class="titlebar-label">Sticky</span>
    </div>

    <div class="opacity-control">
      <input
        type="range"
        class="opacity-slider"
        min="30"
        max="100"
        value="97"
        title="Window opacity"
      >
    </div>

    <div class="titlebar-controls">
      <!-- Pin indicator (always on top — just visual) -->
      <button class="titlebar-btn" title="Always on top" style="cursor: default; opacity: 0.4;">
        <svg viewBox="0 0 24 24"><path d="M12 2L12 16M12 2L8 6M12 2L16 6M5 22L19 22"/></svg>
      </button>
      <!-- Close -->
      <button class="titlebar-btn close" id="btn-close" title="Close sticky">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6L18 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Notion page content -->
  <div class="content">
    <iframe id="notion-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" allowfullscreen></iframe>
  </div>

  <script>
    // Parse URL from query string
    const params = new URLSearchParams(window.location.search);
    const notionUrl = params.get('url');

    const frame = document.getElementById('notion-frame');
    const loading = document.getElementById('loading');

    if (notionUrl) {
      frame.src = notionUrl;
      frame.addEventListener('load', () => {
        loading.classList.add('hidden');
      });
      // Fallback: hide loading after 8s regardless
      setTimeout(() => loading.classList.add('hidden'), 8000);
    }

    // Close button
    document.getElementById('btn-close').addEventListener('click', () => {
      window.notionSticky.closeWindow();
    });

    // Opacity slider
    document.querySelector('.opacity-slider').addEventListener('input', (e) => {
      window.notionSticky.setOpacity(e.target.value / 100);
    });

    // Keyboard: Escape to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.notionSticky.closeWindow();
      }
    });
  </script>
</body>
</html>
