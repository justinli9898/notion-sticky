<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Sticky</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #1a1a1a;
      --surface: #222;
      --accent: #ffcc00;
      --text: #aaa;
      --text-light: #ddd;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 10px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border-radius: var(--radius);
      -webkit-app-region: drag;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
      text-align: center;
      gap: 16px;
    }

    .icon {
      font-size: 28px;
      margin-bottom: 2px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: -0.2px;
    }

    p {
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
      max-width: 300px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-size: 12px;
      color: var(--text);
    }

    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 10px;
      color: var(--accent);
    }

    .input-row {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 320px;
      -webkit-app-region: no-drag;
    }

    input {
      flex: 1;
      height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--text-light);
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: #555;
    }

    button.go {
      height: 32px;
      padding: 0 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.15s;
    }

    button.go:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📌</div>
    <h1>No Notion URL in clipboard</h1>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <span>Open a page in Notion and press <kbd>Ctrl</kbd>+<kbd>L</kbd> to copy its URL</span>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <span>Then press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> again</span>
      </div>
    </div>

    <p style="margin-top: 4px; font-size: 11px; color: #555;">— or paste a URL below —</p>

    <div class="input-row">
      <input type="text" id="url-input" placeholder="https://notion.com/your-page..." autofocus>
      <button class="go" id="btn-go">Pin it</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('url-input');
    const btn = document.getElementById('btn-go');

    function submit() {
      const url = input.value.trim();
      if (url && (url.includes('notion.so') || url.includes('notion.site') || url.includes('notion.com'))) {
        window.notionSticky.openUrl(url);
      } else {
        input.style.borderColor = '#e84040';
        setTimeout(() => input.style.borderColor = '', 800);
      }
    }

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
      if (e.key === 'Escape') window.notionSticky.closeWindow();
    });
  </script>
</body>
</html>
